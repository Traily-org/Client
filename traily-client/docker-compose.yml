services:
    app:
        container_name: traily_client_dev
        image: traily_client_dev
        build:
            context: ./
            dockerfile: Dockerfile
            target: dev
        ports:
            - "8081:8081"
        environment:
            # Your machine's LAN IP, so the QR code / bundle URL Expo Go
            # uses on a physical device points somewhere reachable.
            # macOS: ipconfig getifaddr en0
            # Windows (PowerShell): ipconfig | findstr IPv4
            # Linux: hostname -I
            - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
        tty: true
        stdin_open: true
        volumes:
            - ./:/app
            - node_modules:/app/node_modules
        restart: unless-stopped

volumes:
    node_modules:
