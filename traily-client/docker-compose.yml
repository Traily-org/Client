services:
  app:
    container_name: traily_client_dev
    image: traily_client_dev
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
    # Host networking so Metro's LAN URL / QR code (used by Expo Go on a
    # physical device) is reachable. Linux only — on macOS/Windows, drop
    # this, publish the ports below instead, and set
    # REACT_NATIVE_PACKAGER_HOSTNAME to your machine's LAN IP.
    network_mode: host
    tty: true
    stdin_open: true
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
